name: FreelanceChain CI
on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'backend/**', 'deploy/**', 'package*.json', 'vercel.mjs', '.github/workflows/ci.yml']
  pull_request:
    paths: ['src/**', 'public/**', 'backend/**', 'deploy/**', 'package*.json', 'vercel.mjs', '.github/workflows/ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      TEST_MONGO_BASE: mongodb://127.0.0.1:27017
      JWT_SECRET: ci-only-synthetic-csrf-value-not-a-production-secret
      EVENT_EMAILS_ENABLED: 'false'
      OBSERVABILITY_LOGS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - name: Frontend tests
        run: npm test -- --watchAll=false --runInBand
      - name: Hosting configuration checks
        run: node --test deploy/hostingConfig.test.mjs
      - name: Production build required by same-origin integration tests
        env:
          REACT_APP_API_URL: /api
        run: npm run build
      - name: Backend unit and isolated database checks
        working-directory: backend
        env:
          NODE_ENV: test
        run: node --test --test-concurrency=1 *.test.js scripts/apiBenchmarkMetrics.test.js
